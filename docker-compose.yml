#version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    container_name: artifactory-db
    environment:
      POSTGRES_DB: artifactory
      POSTGRES_USER: artifactory
      POSTGRES_PASSWORD: password
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
       - default
#      - artifactory-net

  artifactory:
    #image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.146.35
    image: releases-docker.jfrog.io/jfrog/artifactory-cpp-ce:7.63.12 # https://conan.io/downloads
    container_name: artifactory
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      - JF_SHARED_DATABASE_TYPE=postgresql
      - JF_SHARED_DATABASE_DRIVER=org.postgresql.Driver
      - JF_SHARED_DATABASE_URL=jdbc:postgresql://postgresql:5432/artifactory
      - JF_SHARED_DATABASE_USERNAME=artifactory
      - JF_SHARED_DATABASE_PASSWORD=password

    volumes:
      - ./artifactory_data:/var/opt/jfrog/artifactory
    depends_on:
      - postgresql
    networks:
      - default
#      - artifactory-net

